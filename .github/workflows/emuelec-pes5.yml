name: EmuELEC PES5 core (aarch64, glibc 2.28, sin ventana)

# Etapa 1b-A: recompila default.xbe (en el runner, x86) y compila el juego recompilado para EmuELEC S905X3 (aarch64)
# con el harness del SDK: backend nulo, audio nulo, sin ventana. Sirve para comprobar en la caja que el codigo
# recompilado arranca y llega a dibujar fotogramas, antes de escribir el backend GLES.
# REQUIERE assets/default.xbe en el repo: usa un repo PRIVADO (el xbe y el codigo recompilado son del juego de Konami).
# Se lanza a mano: Actions -> "EmuELEC PES5 core" -> Run workflow (o al subir cambios a emuelec/headless).

on:
  push:
    branches: [emuelec]
    paths:
      - 'emuelec/headless/**'
      - 'emuelec/shim/**'
      - '.github/workflows/emuelec-pes5-core.yml'
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build python3 debootstrap binutils ccache

      - name: Sysroot Debian buster arm64
        run: |
          sudo debootstrap --foreign --no-check-gpg --variant=minbase --arch=arm64 \
            --include=libc6-dev,libgcc-8-dev,libstdc++-8-dev,linux-libc-dev \
            buster /opt/sysroot http://archive.debian.org/debian 2>&1 | tail -15
          # --foreign solo desempaqueta la base: los .deb de --include se abren a mano
          for d in /opt/sysroot/var/cache/apt/archives/*.deb; do
            echo "desempaquetando $d"
            sudo dpkg-deb -x "$d" /opt/sysroot
          done
          # enlaces absolutos (/lib/...) del sysroot -> relativos dentro del sysroot
          sudo python3 - <<'PY'
          import os
          root = '/opt/sysroot'
          n = 0
          for dp, dn, fn in os.walk(root):
              for name in dn + fn:
                  p = os.path.join(dp, name)
                  if not os.path.islink(p):
                      continue
                  t = os.readlink(p)
                  if not os.path.isabs(t):
                      continue
                  tgt = os.path.join(root, t.lstrip('/'))
                  rel = os.path.relpath(tgt, os.path.dirname(p))
                  os.unlink(p)
                  os.symlink(rel, p)
                  n += 1
          print('enlaces absolutos reescritos:', n)
          PY
          G=/opt/sysroot/usr/lib/gcc/aarch64-linux-gnu/8
          sudo ln -sfn ../../../aarch64-linux-gnu/libgcc_s.so.1 "$G/libgcc_s.so"
          sudo ln -sfn ../../../aarch64-linux-gnu/libstdc++.so.6 "$G/libstdc++.so"
          L=/opt/sysroot/usr/lib/aarch64-linux-gnu
          test -e "$G/libgcc_s.so"
          test -e "$G/libstdc++.so"
          test -e "$L/libm.so"
          test -e "$L/libc.so"
          test -f "$G/crtbegin.o"
          test -f /opt/sysroot/usr/include/c++/8/string
          test -f /opt/sysroot/usr/include/stdio.h
          test -f "$L/crt1.o"

      - name: Toolchain de CMake (con envoltorios de clang)
        run: |
          sudo mkdir -p /opt/wrap
          sudo tee /opt/wrap/clang++ > /dev/null <<'EOF'
          #!/bin/bash
          S=/opt/sysroot
          G=$S/usr/lib/gcc/aarch64-linux-gnu/8
          extra=(--sysroot=$S -nostdinc++ -isystem $S/usr/include/c++/8 -isystem $S/usr/include/aarch64-linux-gnu/c++/8 -isystem $S/usr/include/c++/8/backward)
          link=1
          for a in "$@"; do
            case "$a" in -c|-E|-S) link=0 ;; esac
          done
          tail=()
          # glibc 2.28: pthread_*, dlopen y libm estan en libpthread/libdl/libm (no en libc)
          if [ $link = 1 ]; then extra+=(-fuse-ld=lld -B$G -L$G); tail=(-lpthread -ldl -lm); fi
          exec /usr/bin/clang++ "${extra[@]}" "$@" "${tail[@]}"
          EOF
          sudo tee /opt/wrap/clang > /dev/null <<'EOF'
          #!/bin/bash
          S=/opt/sysroot
          G=$S/usr/lib/gcc/aarch64-linux-gnu/8
          extra=(--sysroot=$S)
          link=1
          for a in "$@"; do
            case "$a" in -c|-E|-S) link=0 ;; esac
          done
          tail=()
          if [ $link = 1 ]; then extra+=(-fuse-ld=lld -B$G -L$G); tail=(-lpthread -ldl -lm); fi
          exec /usr/bin/clang "${extra[@]}" "$@" "${tail[@]}"
          EOF
          sudo chmod +x /opt/wrap/clang /opt/wrap/clang++
          cat > "$GITHUB_WORKSPACE/emuelec-aarch64.cmake" <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER /opt/wrap/clang)
          set(CMAKE_CXX_COMPILER /opt/wrap/clang++)
          set(CMAKE_ASM_COMPILER /opt/wrap/clang)
          set(CMAKE_C_COMPILER_TARGET aarch64-linux-gnu)
          set(CMAKE_CXX_COMPILER_TARGET aarch64-linux-gnu)
          set(CMAKE_ASM_COMPILER_TARGET aarch64-linux-gnu)
          set(CMAKE_FIND_ROOT_PATH /opt/sysroot)
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          EOF

      - name: Comprobar que esta el default.xbe
        run: |
          if [ ! -f assets/default.xbe ]; then
            echo "::error::Falta assets/default.xbe en el repo. Sube tu default.xbe a assets/ en un repo PRIVADO."
            exit 1
          fi
          ls -la assets/default.xbe
          sha1sum assets/default.xbe

      - name: Codigo recompilado en cache
        id: gen
        uses: actions/cache@v4
        with:
          path: generated
          key: gen-${{ hashFiles('assets/default.xbe', 'config/game.toml', 'sdk/tools/recomp/**', 'sdk/runtime/xdk/**') }}

      - name: Recompilar default.xbe (x86, en el runner)
        if: steps.gen.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          cmake -S tools/host -B out/host -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tail -5
          cmake --build out/host 2>&1 | tail -15
          ./out/host/xbe_recomp config/game.toml --xdk sdk/xdk 2>&1 | tail -30
          ls generated/game | head -5
          ls generated/game | wc -l
          test -f generated/game/x86_func_mapping.cpp
          test -f generated/game/image_symbols.h

      - name: Cache del compilador (ccache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-core-${{ github.sha }}
          restore-keys: ccache-core-

      - name: Compilar el nucleo para aarch64 (harness sin ventana)
        env:
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 3G
        run: |
          set -o pipefail
          export CXX="ccache /opt/wrap/clang++"
          emuelec/headless/build_headless.sh . generated/game out-core 2>&1 | tee build.log
          ccache -s | head -12
          file out-core/pes5_core

      - name: Reunir resultado
        run: |
          mkdir -p out
          cp out-core/pes5_core out/
          strip --strip-unneeded out/pes5_core || true
          ls -la out

      - name: Comprobar versiones de glibc y libstdc++
        run: |
          echo "== GLIBC maximo pedido (la caja tiene 2.29) =="
          readelf -Ws --dyn-syms out/pes5_core | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -3
          echo "== GLIBCXX maximo pedido (la caja llega a 3.4.25) =="
          readelf -Ws --dyn-syms out/pes5_core | grep -o 'GLIBCXX_[0-9.]*' | sort -uV | tail -3 || true
          echo "== librerias que pide =="
          readelf -d out/pes5_core | grep -E "NEEDED|RUNPATH|RPATH" || true

      - uses: actions/upload-artifact@v4
        with:
          name: emuelec-pes5-core-aarch64
          path: out/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-core
          path: build.log
          if-no-files-found: ignore
